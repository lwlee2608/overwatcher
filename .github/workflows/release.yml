name: Release

# Triggered by pushing an annotated tag of the form `vX.Y.Z`. Builds
# Linux agent and Linux/macOS owctl binaries with version stamped via ldflags,
# attaches a SHA256SUMS file, and publishes them as a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/overwatcher-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/overwatcher-backend/go.mod
          cache-dependency-path: services/overwatcher-backend/go.sum

      - name: Validate release version
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME must match committed VERSION ($version)." >&2
            exit 1
          fi

      - name: Build release artifacts
        run: |
          rm -rf dist
          make release-agent release-owctl COMMIT_SHA=

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            services/overwatcher-backend/dist/overwatcher-agent_linux_amd64
            services/overwatcher-backend/dist/overwatcher-agent_linux_arm64
            services/overwatcher-backend/dist/owctl_linux_amd64
            services/overwatcher-backend/dist/owctl_linux_arm64
            services/overwatcher-backend/dist/owctl_darwin_amd64
            services/overwatcher-backend/dist/owctl_darwin_arm64
            services/overwatcher-backend/dist/SHA256SUMS
          generate_release_notes: true
