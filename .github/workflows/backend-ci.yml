name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'services/overwatcher-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'services/overwatcher-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/overwatcher-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/overwatcher-backend/go.mod
          cache-dependency-path: services/overwatcher-backend/go.sum
      - run: make test
