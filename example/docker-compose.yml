# Example: run the overwatcher agent via Docker.
#
# The agent needs access to the host Docker daemon so it can run
# `docker compose pull/up` on the stacks it manages.
#
# Prerequisites:
#   1. On the host, keep every stack the agent should deploy under a single
#      root directory (e.g. /home/dev/). Each subdirectory is one stack.
#      Example:
#          /home/dev/medtutor/docker-compose.yml
#          /home/dev/chatbot/docker-compose.yml
#   2. Mount that root at /stacks in the agent container. Adding a new stack
#      on the host then needs zero changes to the agent — just create the new
#      subdirectory and register the project in the UI with its compose path
#      relative to /stacks (e.g. "medtutor/docker-compose.yml").
#
# Usage:
#   AGENT_SHARED_SECRET=<secret> AGENT_NAME=<agent-name> docker compose up -d
#
services:
  agent:
    image: lwlee2608/agent:latest
    environment:
      - AGENT_SHARED_SECRET=${AGENT_SHARED_SECRET}
      - AGENT_COORDINATOR_URL=https://your-coordinator.example.com
      - AGENT_NAME=${AGENT_NAME:-}
      - AGENT_STACKS_DIR=/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/dev:/stacks
