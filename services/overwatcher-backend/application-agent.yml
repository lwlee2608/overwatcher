log:
  level: info
agent:
  name: ""                   # required; override with AGENT_NAME
  coordinator_url: "http://localhost:8080"
  shared_secret: ""          # override with AGENT_SHARED_SECRET
  poll_timeout: 30s          # client-side timeout; must exceed coordinator's 25s long-poll
  stacks_dir: "/stacks"      # container-side root for every stack the agent deploys;
                             # each project's compose_file is resolved relative to it.
