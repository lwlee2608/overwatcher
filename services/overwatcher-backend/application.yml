log:
  level: debug
http:
  port: 8080
github:
  app_id: 0
  webhook_secret: ""
  private_key: ""
agent:
  shared_secret: ""  # override with AGENT_SHARED_SECRET; required for /api/v1/deploy/* endpoints
auth:
  session_ttl: 720h            # sliding 30d
  cookie_secure: false         # set true (or AUTH_COOKIE_SECURE=true) when serving over HTTPS
  cookie_domain: ""            # optional; leave empty for host-only cookie
  bootstrap_email: ""          # AUTH_BOOTSTRAP_EMAIL; if set with bootstrap_password, ensures user exists at startup
  bootstrap_password: ""       # AUTH_BOOTSTRAP_PASSWORD; min 8 chars
  bootstrap_name: ""           # AUTH_BOOTSTRAP_NAME; only used if the user is created (not on existing rows)
database:
  url: ""      # required; override with DATABASE_URL
  schema: ""   # optional; defaults to "public"
dispatch:
  in_flight_timeout: 10m       # reaper timeout threshold
  max_attempts: 3              # max retries before permanent failure
  sweep_interval: 1m           # reaper scan frequency
  shutdown_timeout: 30s        # graceful shutdown deadline
